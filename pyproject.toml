[project]
name = "latlng_to_state"
version = "0.0.1dev"
description = "Convert latitude and longitude to U.S. state using geospatial lookup."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[tool.setuptools.package-data]
"latlng_to_state.datasets.data" = ["*.parquet"]
